services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Web Service (Docker)
  # -------------------------------------------------------------
  - type: web
    name: sip-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: improveREADME
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sip-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: sip-frontend
          property: host
      - key: BACKEND_URL
        value: https://sip-backend-sft4.onrender.com
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. React 18 Frontend (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: sip-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    branch: improveREADME
    envVars:
      - key: VITE_API_URL
        value: https://sip-backend-sft4.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # -------------------------------------------------------------
  # 3. Managed PostgreSQL Database
  # -------------------------------------------------------------
  - name: sip-db
    databaseName: sip_database
    user: sip_user
    plan: free
    region: oregon
