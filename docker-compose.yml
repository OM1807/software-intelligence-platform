version: '3.8'

services:
  db:
    image: postgres:15
    container_name: sip_db
    restart: always
    environment:
      POSTGRES_USER: sip_user
      POSTGRES_PASSWORD: sip_password
      POSTGRES_DB: sip_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
    container_name: sip_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://sip_user:sip_password@db:5432/sip_database

  frontend:
    build:
      context: ./frontend
    container_name: sip_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: