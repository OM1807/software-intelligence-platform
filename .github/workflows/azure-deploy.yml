name: Build, Test & Deploy to Azure

on:
  push:
    branches: [ improveREADME, main ]
  pull_request:
    branches: [ improveREADME, main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ================================================================
  # 1. Backend: Test, Build Docker Image & Deploy to Azure Container App
  # ================================================================
  backend-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Tree-sitter, Git)
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

      - name: Azure CLI Login
        uses: azure/login@v2
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        if: ${{ secrets.ACR_LOGIN_SERVER != '' }}
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Backend Docker Image
        if: ${{ secrets.ACR_LOGIN_SERVER != '' }}
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/sip-backend:${IMAGE_TAG} -t ${{ secrets.ACR_LOGIN_SERVER }}/sip-backend:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/sip-backend:${IMAGE_TAG}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/sip-backend:latest

      - name: Deploy to Azure Container Apps
        if: ${{ secrets.AZURE_CONTAINER_APP_NAME != '' }}
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/sip-backend:${{ github.sha }}

  # ================================================================
  # 2. Frontend: Test, Typecheck, Build & Deploy to Azure Static Web Apps
  # ================================================================
  frontend-deploy:
    needs: backend-deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Frontend for Production
        env:
          VITE_API_URL: ${{ secrets.VITE_BACKEND_URL }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend'
          output_location: 'dist'
          skip_app_build: true
